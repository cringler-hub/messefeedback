name: Cron Triggers

# Nur noch für manuelles Testen (workflow_dispatch). Die eigentliche
# Zeitsteuerung läuft über n8n (Schedule Trigger + HTTP Request), da
# GitHub Actions' `schedule`-Event sich in der Praxis als zu
# unzuverlässig für exakte Uhrzeiten erwiesen hat (beobachtete
# Läufe wichen um mehrere Stunden von der konfigurierten Zeit ab).
#
# Manuell auslösen: Actions-Tab -> "Cron Triggers" -> "Run workflow".
# Ruft dabei beide Endpunkte auf.

on:
  workflow_dispatch: {}

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Team-Debriefing auslösen
        run: |
          curl -fsS "${{ secrets.APP_BASE_URL }}/cron/debriefing_0630.php?token=${{ secrets.CRON_SECRET }}"

      - name: Erinnerungsmail auslösen
        run: |
          curl -fsS "${{ secrets.APP_BASE_URL }}/cron/reminder_18h.php?token=${{ secrets.CRON_SECRET }}"
